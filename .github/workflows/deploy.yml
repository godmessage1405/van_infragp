name: Deploy YOUPI PG to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Deployment on VPS..."
            cd ${{ secrets.VPS_TARGET_DIR || '/root/YouPI-PG' }}
            
            echo "📥 Pulling latest changes from main branch..."
            git pull origin main
            
            echo "📦 Installing any updated production dependencies..."
            npm install --omit=dev
            
            echo "🔄 Restarting application services..."
            if command -v pm2 &> /dev/null; then
              pm2 restart all || pm2 start scripts/start.js --name youpi-pg
            else
              npm run start
            fi
            
            echo "✅ Deployment finished successfully!"

