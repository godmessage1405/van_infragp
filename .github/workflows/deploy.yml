name: Auto Deploy to Windows VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Windows VPS
    runs-on: [self-hosted, windows]

    steps:
      - name: Pull Latest Changes and Restart Server
        shell: powershell
        run: |
          Write-Host "🚀 Starting Auto Deployment on VPS..."
          Set-Location "C:\infravan-pg"

          Write-Host "📥 Pulling latest changes from GitHub main branch..."
          git pull origin main

          Write-Host "📦 Checking updated dependencies..."
          npm install --omit=dev

          Write-Host "🔄 Restarting application server..."
          if (Get-Command pm2 -ErrorAction SilentlyContinue) {
            pm2 restart all
          } else {
            Stop-Process -Name "node" -Force -ErrorAction SilentlyContinue
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm run start" -WindowStyle Hidden
          }

          Write-Host "✅ Auto Deployment finished! Server is live with latest changes."
